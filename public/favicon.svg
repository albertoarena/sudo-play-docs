<svg xmlns="http://www.w3.org/2000/svg" width="824" height="824" viewBox="100 100 824 824">
  <!-- Sudo Play app icon, copied from sudo-play/art/icon without its drop shadow. macOS grid: an 824 body on a 1024 canvas, 100 margin.
       A terminal window: dim prompt, bright green equaliser bars. Colours from
       the shared scheme: term-bg #09090b, term-dim #9f9fa9, term-green #00d492. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f23"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#3f3f46" stroke-width="3"/>
  <g fill="#3f3f46">
    <circle cx="200" cy="200" r="17"/>
    <circle cx="254" cy="200" r="17"/>
    <circle cx="308" cy="200" r="17"/>
  </g>
  <g transform="translate(234 318) scale(13)">
    <path d="M4.6 8.4 13.2 16 4.6 23.6" fill="none" stroke="#9f9fa9" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#00d492">
      <rect x="20" y="18" width="4" height="10" rx="1"/>
      <rect x="28" y="6" width="4" height="22" rx="1"/>
      <rect x="36" y="12" width="4" height="16" rx="1"/>
    </g>
  </g>
</svg>
